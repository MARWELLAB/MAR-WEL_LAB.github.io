<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MAR-WEL Admin Login</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                MAR-WEL
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Marine Aquaculture & Research Laboratory
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Admin email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <a href="index.html" class="back-link">
                ← Back to MAR-WEL Website
            </a>

        </div>

    </div>

    <script type="module" src="js/js/admin-login.js"></script>

</body>

</html>
