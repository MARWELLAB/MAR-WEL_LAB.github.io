<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR-WEL Admin Login</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      background: #f4f7fb;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    .login-logo {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a2e4a;
      margin-bottom: 0.5rem;
    }
    h1 {
      text-align: center;
      color: #1a2e4a;
      margin-bottom: 0.3rem;
    }
    .login-subtitle {
      text-align: center;
      color: #6b7c93;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      color: #1a2e4a;
    }
    input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #ccdbe8;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.9rem;
      background: #1e5f8a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1a2e4a;
    }
    #error {
      color: #e74c3c;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">MAR-WEL</div>
      <h1>Admin Login</h1>
      <p class="login-subtitle">Marine Aquaculture & Research Laboratory</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
        <button id="logoutBtn" class="btn">Logout</button>
        <p id="error"></p>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBrWfsmDxeDgmsmg3wxqwAUjwtDLnxt4_A",
      authDomain: "mar-wel-lab-86a7c.firebaseapp.com",
      projectId: "mar-wel-lab-86a7c",
      storageBucket: "mar-wel-lab-86a7c.firebasestorage.app",
      messagingSenderId: "430163655582",
      appId: "1:430163655582:web:950b7417d675b27adc748f",
      measurementId: "G-JEBRTKG9BT"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Login Form Handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Login successful
        window.location.href = "admin-dashboard.html";
      } catch (error) {
        errorMsg.style.display = "block";
        errorMsg.textContent = "Invalid email or password. Please try again.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
