<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MAR-WEL Admin Dashboard</title>

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>

<header class="admin-header">

    <div>

        <strong>MAR-WEL Admin</strong>

        <span id="adminEmail"></span>

    </div>

    <button id="logoutBtn">
        Logout
    </button>

</header>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrWfsmDxeDgmsmg3wxqwAUjwtDLnxt4_A",
    authDomain: "mar-wel-lab-86a7c.firebaseapp.com",
    projectId: "mar-wel-lab-86a7c",
    storageBucket: "mar-wel-lab-86a7c.firebasestorage.app",
    messagingSenderId: "430163655582",
    appId: "1:430163655582:web:950b7417d675b27adc748f",
    measurementId: "G-JEBRTKG9BT"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Protect the page - redirect to login if not logged in
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "admin-login.html";
    }
  });

  // Logout button
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      window.location.href = "admin-login.html";
    } catch (error) {
      console.error("Logout failed:", error);
      alert("Logout failed. Please try again.");
    }
  });
</script>
<script
    type="module"
    src="js/js/admin-dashboard.js">
</script>

</body>

</html>
