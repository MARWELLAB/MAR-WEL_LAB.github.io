<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MAR-WEL Admin Dashboard</title>

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>

<header class="admin-header">

    <div>

        <strong>MAR-WEL Admin</strong>

        <span id="adminEmail"></span>

    </div>

    <button id="logoutBtn">
        Logout
    </button>

</header>


<main class="dashboard">

    <h1>Publication Management</h1>

    <p>
        Add, edit and delete research publications.
    </p>


    <section class="admin-form">

        <h2 id="formTitle">
            Add Publication
        </h2>


        <form id="publicationForm">

            <input
                type="hidden"
                id="publicationId"
            >


            <label>
                Title
            </label>

            <input
                type="text"
                id="title"
                required
            >


            <label>
                Authors
            </label>

            <input
                type="text"
                id="authors"
                required
            >


            <label>
                Journal / Conference
            </label>

            <input
                type="text"
                id="journal"
            >


            <label>
                Year
            </label>

            <input
                type="number"
                id="year"
                min="1900"
                max="2100"
            >


            <label>
                DOI
            </label>

            <input
                type="text"
                id="doi"
                placeholder="https://doi.org/..."
            >


            <label>
                PDF Link
            </label>

            <input
                type="url"
                id="pdfUrl"
                placeholder="https://..."
            >


            <label>
                Publication Type
            </label>

            <select id="type">

                <option value="Journal">
                    Journal
                </option>

                <option value="Conference">
                    Conference
                </option>

                <option value="Book">
                    Book
                </option>

                <option value="Patent">
                    Patent
                </option>

            </select>


            <label>
                Abstract
            </label>

            <textarea
                id="abstract"
                rows="5"
            ></textarea>


            <div class="form-buttons">

                <button type="submit">
                    Save Publication
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                >
                    Cancel
                </button>

            </div>


            <p id="statusMessage"></p>

        </form>

    </section>


    <section class="publication-list">

        <h2>
            Existing Publications
        </h2>

        <div id="publicationTable">
            Loading...
        </div>

    </section>

</main>


<script
    type="module"
    src="js/js/admin-dashboard.js">
</script>

</body>

</html>
